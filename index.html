    <script>
      (function() {
        try {
          var origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch.bind(window) : null;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return typeof currentFetch === 'function' ? currentFetch.bind(window) : (origFetch || window.fetch);
            },
            set: function(fn) {
              currentFetch = typeof fn === 'function' ? fn.bind(window) : fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
